<h3>Изменяем кириллицу на латиницу по клику</h3>

<div class="passport-layout">
  <p class="passport-issuer" data-en="MAIN DIRECTORATE OF THE MIA FOR MOSCOW REGION">ГУ МВД ПО МОСКОВСКОЙ ОБЛАСТИ</p>
  <p class="passport-date">29.09.2026</p>
  <span class="passport-code">000-000</span>
  <p class="passport-surname"><span id="surname" data-en="Sidorenko">Сидоренко</span></p>
  <p class="passport-name"><span id="name" data-en="Mikhail">Михаил</span></p>
  <p class="passport-patronymic" data-en="Evgenyevich">Евгеньевич</p>
  <p class="passport-sex" data-en="MALE">МУЖ.</p>
  <p class="passport-birth"><span id="birth-year" data-en="2007 year">2007 г.</span></p>
  <p class="passport-place" data-en="ODINTSOVO">ГОР. ОДИНЦОВО</p>
  <img class="passport-photo" src="assets/images/passport-photo.jpg" alt="Учебное фото из примера преподавателя">
  <button class="passport-button" id="change-language" type="button">Заменить</button>
</div>
